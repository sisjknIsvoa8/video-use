<style>

<body>
<div id="bg"></div><canvas id="gl" width="1920" height="1080"></canvas><div id="fg"></div>
<script>const EP=(new URLSearchParams(location.search)).get('ep')||'ep1';document.write(`<script src="../${EP}/timing.js"><\/script>`);</script>
<script src="node_modules/three/build/three.min.js"></script>
<script>
/* ================= core ================= */
const M=window.META, B=M.blocks, OUTRO=7.0, TOTAL=M.total+OUTRO;
const C={red:"#e1173f",gold:"#f5b942",cyan:"#4fd1ff",green:"#3ddc97",ink:"#07070b",paper:"#f2efe9"};
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), lin=(t,a,b)=>clamp((t-a)/(b-a));
const eOut=x=>1-Math.pow(1-x,3), eIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eBack=x=>{const c1=1.7,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
const pop=(u,t0,d=.45)=>u<t0?0:eBack(clamp((u-t0)/d));
const fade=(u,t0,d=.4)=>eOut(lin(u,t0,t0+d));
function rnd(s){const x=Math.sin(s*12.9898)*43758.5453;return x-Math.floor(x);}
function el(html,x,y,{w=0,s=1,r=0,o=1,ox="50%",oy="50%",z=5,blur=0}={}){if(o<=.001||s<=.001)return "";return `<div class="abs" style="left:${x}px;top:${y}px;${w?`width:${w}px;`:""}opacity:${o};transform:rotate(${r}deg) scale(${s});transform-origin:${ox} ${oy};z-index:${z};${blur?`filter:blur(${blur}px);`:""}">${html}</div>`;}
function txt(s,x,y,{size=72,color=C.paper,w=0,align="left",o=1,s2=1,weight=900,cls="disp",ls=-1,lh=1.02,z=8}={}){return el(`<div class="${cls}" style="font-size:${size}px;color:${color};text-align:${align};letter-spacing:${ls}px;line-height:${lh};font-weight:${weight}">${s}</div>`,x,y,{w,o,s:s2,z});}
function kin(s,x,y,u,t0,o={}){ // word-by-word kinetic type
  const ws=s.split(" ");return el(`<div class="disp" style="font-size:${o.size||96}px;color:${o.color||C.paper};text-align:${o.align||"left"};line-height:1.02;letter-spacing:-2px">${ws.map((w,i)=>{const p=clamp((u-t0-i*(o.stag||.08))/.35);return `<span style="display:inline-block;opacity:${p};transform:translateY(${(1-eOut(p))*40}px);filter:blur(${(1-p)*8}px);margin-right:.22em">${w}</span>`;}).join("")}</div>`,x,y,{w:o.w||1600,z:o.z||8});}
function badge(tag){const m={D:["DEMOSTRADO","#0f5132",C.green],P:["PROBABLE","#5a4300",C.gold],H:["HIPÓTESIS","#5a0f1c","#ff6b81"]}[tag];return m?`<span class="badge" style="background:${m[1]};color:${m[2]};border:1px solid ${m[2]}">● ${m[0]}</span>`:"";}

/* ---------- dress-form mannequin (non-explicit, educational) ---------- */
function form(o={}){ // front view; whr: waist/hip, bust 0..1, firm 0..1, weight 0..1
  const hip=100+(o.weight||0)*30, waist=hip*(o.whr||0.7), bust=o.bust??.5, firm=o.firm??.8, sh=96+(o.weight||0)*16;
  const cx=200, by=215+(1-firm)*28, br=34+bust*30, bw=48+bust*10;
  const id="g"+Math.floor(rnd((o.seed||1)*7)*1e6);
  const col=o.color||"#c9a27e", hi=o.hi||"#f3dcc2";
  const path=`M${cx-34} 60 C${cx-60} 70 ${cx-sh} 84 ${cx-sh} 120 C${cx-sh+6} 170 ${cx-waist*1.05} 200 ${cx-waist*1.08} 250 C${cx-waist} 300 ${cx-waist} 320 ${cx-waist} 330 C${cx-hip*.98} 380 ${cx-hip} 420 ${cx-hip*.97} 470 C${cx-hip*.9} 520 ${cx-hip*.78} 560 ${cx-hip*.7} 580 L${cx+hip*.7} 580 C${cx+hip*.78} 560 ${cx+hip*.9} 520 ${cx+hip*.97} 470 C${cx+hip} 420 ${cx+hip*.98} 380 ${cx+waist} 330 C${cx+waist} 320 ${cx+waist} 300 ${cx+waist*1.08} 250 C${cx+waist*1.05} 200 ${cx+sh-6} 170 ${cx+sh} 120 C${cx+sh} 84 ${cx+60} 70 ${cx+34} 60 Z`;
  return `<svg viewBox="0 0 400 700" width="100%" height="100%" overflow="visible"><defs>
   <linearGradient id="${id}" x1="0" x2="1"><stop offset="0" stop-color="${col}" stop-opacity=".55"/><stop offset=".45" stop-color="${hi}"/><stop offset="1" stop-color="${col}" stop-opacity=".6"/></linearGradient>
   <radialGradient id="${id}b"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
   <rect x="194" y="580" width="12" height="80" fill="#3a3340"/><ellipse cx="200" cy="668" rx="70" ry="12" fill="#2a2430"/>
   <path d="M${cx-18} 30 L${cx+18} 30 L${cx+22} 62 L${cx-22} 62Z" fill="${col}" opacity=".9"/><ellipse cx="200" cy="28" rx="20" ry="6" fill="#3a3340"/>
   <path d="${path}" fill="url(#${id})" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/>
   <ellipse cx="${cx-bw*.62}" cy="${by}" rx="${br}" ry="${br*.86}" fill="${col}" opacity=".28"/><ellipse cx="${cx+bw*.62}" cy="${by}" rx="${br}" ry="${br*.86}" fill="${col}" opacity=".28"/>
   <ellipse cx="${cx-bw*.62-6}" cy="${by-8}" rx="${br*.6}" ry="${br*.45}" fill="url(#${id}b)"/><ellipse cx="${cx+bw*.62-6}" cy="${by-8}" rx="${br*.6}" ry="${br*.45}" fill="url(#${id}b)"/>
   <path d="M${cx} 100 L${cx} 575" stroke="rgba(0,0,0,.18)" stroke-width="2" stroke-dasharray="6 8"/>
   ${o.tape?`<path d="M${cx-waist} 318 Q${cx} 336 ${cx+waist} 318" stroke="${C.gold}" stroke-width="5" fill="none"/><path d="M${cx-hip} 432 Q${cx} 452 ${cx+hip} 432" stroke="${C.cyan}" stroke-width="5" fill="none"/>`:""}
  </svg>`;
}
function profile(o={}){ // side view; lumbar 0..1 curvature, belly 0..1
  const L=o.lumbar??.5, bel=o.belly||0, col=o.color||"#c9a27e";
  const back=`C 150 250 ${148-L*30} 300 ${150-L*40} 340 C ${150-L*46} 360 ${118-L*40} 380 ${112-L*44} 430 C ${108-L*40} 480 ${130} 520 ${140} 580`;
  const front=`M 210 60 C 250 80 262 150 262 200 C 262 240 240 260 236 290 C ${236+bel*60} ${320+bel*10} ${244+bel*70} ${380} ${236+bel*40} 420 C 236 470 228 520 216 580`;
  return `<svg viewBox="0 0 400 700" width="100%" height="100%" overflow="visible">
   <path d="${front} L 140 580 ${back.replace("C 150 250","")} " fill="none"/>
   <path d="M 170 60 C 150 120 150 200 150 250 ${back} L 216 580 C 228 520 236 470 ${236+bel*40} 420 C ${244+bel*70} 380 ${236+bel*60} ${320+bel*10} 236 290 C 240 260 262 240 262 200 C 262 150 250 80 210 60 Z" fill="${col}" opacity=".85" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/>
   <rect x="174" y="580" width="12" height="80" fill="#3a3340"/><ellipse cx="180" cy="668" rx="70" ry="12" fill="#2a2430"/>
   ${o.spine?`<path d="M 172 110 C 168 200 ${168-L*20} 280 ${166-L*30} 340 C ${164-L*30} 380 ${160-L*18} 420 165 470" stroke="${C.red}" stroke-width="6" fill="none" stroke-dasharray="${o.spineDraw||2000}" stroke-linecap="round"/>`:""}
  </svg>`;
}
function brainToon(o={}){const t=o.t||0;return `<svg viewBox="0 0 400 340" width="100%" height="100%" overflow="visible">
  <path d="M90 230 C40 220 30 150 70 120 C60 70 120 40 160 60 C190 20 260 30 270 70 C330 60 370 120 340 160 C370 200 330 250 290 240 C270 280 200 290 180 260 C140 290 90 270 90 230Z" fill="#ff8fab" stroke="#2b1b25" stroke-width="7"/>
  <path d="M120 110 Q150 130 140 160 M200 70 Q190 110 220 130 M280 100 Q260 140 290 170 M150 210 Q190 190 230 215" stroke="#d96a88" stroke-width="7" fill="none" stroke-linecap="round"/>
  <circle cx="165" cy="170" r="${o.wide?30:24}" fill="#fff" stroke="#2b1b25" stroke-width="5"/><circle cx="245" cy="170" r="${o.wide?30:24}" fill="#fff" stroke="#2b1b25" stroke-width="5"/>
  <circle cx="${168+Math.sin(t*2)*5}" cy="172" r="10" fill="#2b1b25"/><circle cx="${248+Math.sin(t*2)*5}" cy="172" r="10" fill="#2b1b25"/>
  ${o.glasses?`<rect x="128" y="140" width="76" height="60" rx="14" fill="none" stroke="#2b1b25" stroke-width="6"/><rect x="208" y="140" width="76" height="60" rx="14" fill="none" stroke="#2b1b25" stroke-width="6"/><path d="M204 165 L208 165" stroke="#2b1b25" stroke-width="6"/>`:""}
  <path d="${o.smile?"M175 215 Q205 240 235 215":"M180 222 Q205 214 230 222"}" stroke="#2b1b25" stroke-width="6" fill="none" stroke-linecap="round"/>
  ${o.tie?`<path d="M195 262 L215 262 L222 330 L205 345 L188 330Z" fill="${C.red}" stroke="#2b1b25" stroke-width="5"/>`:""}
  <path d="M120 250 L100 320 M290 245 L310 320" stroke="#2b1b25" stroke-width="7" stroke-linecap="round"/></svg>`;}
function gaze(points,u,{color=C.red}={}){ // points [[x,y,t0]]
  let s="",prev=null;points.forEach(([x,y,t0],i)=>{const p=fade(u,t0,.25);if(p<=0)return;
    if(prev) s+=`<line x1="${prev[0]}" y1="${prev[1]}" x2="${x}" y2="${y}" stroke="${color}" stroke-width="3" opacity="${.6*p}"/>`;
    s+=`<circle cx="${x}" cy="${y}" r="${60*p}" fill="url(#heat)" opacity="${.9*p}"/><circle cx="${x}" cy="${y}" r="16" fill="${color}" opacity="${p}"/><text x="${x}" y="${y+7}" font-size="18" text-anchor="middle" fill="#fff" font-family="JetBrains Mono" font-weight="800">${i+1}</text>`;prev=[x,y];});
  return `<svg class="abs" style="left:0;top:0;z-index:9" width="1920" height="1080"><defs><radialGradient id="heat"><stop offset="0" stop-color="${color}" stop-opacity=".7"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></radialGradient></defs>${s}</svg>`;}
function bars(items,u,t0,{x=0,y=0,w=900,h=380,max=1,unit=""}={}){ // items [[label,val,color]]
  const bw=w/items.length;return el(`<svg width="${w}" height="${h+90}" overflow="visible">${items.map(([lab,v,col],i)=>{const p=eOut(lin(u,t0+i*.25,t0+i*.25+.9));const hh=h*v/max*p;return `<rect x="${i*bw+bw*.18}" y="${h-hh}" width="${bw*.64}" height="${hh}" rx="8" fill="${col||C.gold}"/><text x="${i*bw+bw/2}" y="${h+42}" font-size="26" text-anchor="middle" fill="${C.paper}" font-family="Inter" font-weight="700">${lab}</text>${p>.95?`<text x="${i*bw+bw/2}" y="${h-hh-16}" font-size="30" text-anchor="middle" fill="${col||C.gold}" font-family="JetBrains Mono" font-weight="800">${typeof v==="number"&&unit?Math.round(v*100)/100+unit:""}</text>`:""}`;}).join("")}<line x1="0" y1="${h}" x2="${w}" y2="${h}" stroke="rgba(255,255,255,.3)" stroke-width="2"/><text x="0" y="${h+80}" font-size="17" fill="rgba(242,239,233,.5)" font-family="JetBrains Mono" letter-spacing="1">GRÁFICO ILUSTRATIVO · MUESTRA EL ORDEN, NO LA MAGNITUD</text></svg>`,x,y,{z:7});}
function stamp(text,x,y,u,t0,{color=C.red,size=64,r=-8}={}){if(u<t0)return "";const p=clamp((u-t0)/.22);return el(`<div class="disp" style="font-size:${size}px;color:${color};border:8px solid ${color};border-radius:14px;padding:6px 24px;white-space:nowrap;background:rgba(7,7,11,.55)">${text}</div>`,x,y,{s:1+(1-eOut(p))*1.6,o:clamp(p*2),r,z:20});}
function file(title,body,x,y,u,t0,{w=520,r=0,stampTxt="",stampCol=C.red}={}){return el(`<div class="card" style="width:${w}px;padding:28px 32px;position:relative"><div class="mono" style="font-size:18px;color:${C.red};letter-spacing:3px">EXPEDIENTE</div><div class="disp" style="font-size:40px;margin:8px 0 10px">${title}</div><div style="font-size:24px;color:rgba(242,239,233,.75);line-height:1.35">${body}</div>${stampTxt&&u>t0+1.2?`<div class="disp" style="position:absolute;right:20px;top:24px;transform:rotate(-10deg) scale(${1+(1-eOut(clamp((u-t0-1.2)/.2)))*1.4});border:5px solid ${stampCol};color:${stampCol};font-size:26px;padding:2px 12px;border-radius:8px">${stampTxt}</div>`:""}</div>`,x,y,{s:pop(u,t0),r,z:7});}
function globe(u,pins){let g="";for(let i=-60;i<=60;i+=30){const ry=Math.cos(i*Math.PI/180)*300;g+=`<ellipse cx="0" cy="${Math.sin(i*Math.PI/180)*300}" rx="${ry}" ry="${ry*.18}" fill="none" stroke="rgba(79,209,255,.25)" stroke-width="2"/>`;}
  for(let k=0;k<6;k++){const a=((k*30+u*12)%180)*Math.PI/180;g+=`<ellipse cx="0" cy="0" rx="${Math.abs(Math.cos(a))*300}" ry="300" fill="none" stroke="rgba(79,209,255,.25)" stroke-width="2"/>`;}
  return `<svg width="700" height="700" viewBox="-350 -350 700 700" overflow="visible"><circle r="300" fill="rgba(79,209,255,.05)" stroke="rgba(79,209,255,.6)" stroke-width="3"/>${g}${pins.map(([x,y,lab,t0])=>{const p=pop(u,t0);return p?`<g transform="translate(${x} ${y}) scale(${p})"><circle r="14" fill="${C.red}"/><circle r="${20+Math.sin(u*4)*6}" fill="none" stroke="${C.red}" stroke-width="3" opacity=".6"/><text x="22" y="10" font-size="30" fill="#fff" font-family="Inter" font-weight="800">${lab}</text></g>`:"";}).join("")}</svg>`;}

/* ---------- 3D brain (procedural, three.js) ---------- */
let R3=null;
function initBrain(){
  const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('gl'),antialias:true,alpha:true,preserveDrawingBuffer:true});
  renderer.setPixelRatio(1);renderer.setSize(1920,1080,false);
  const scene=new THREE.Scene(), cam=new THREE.PerspectiveCamera(32,1920/1080,.1,100);cam.position.set(0,.2,6.2);
  const grp=new THREE.Group();scene.add(grp);
  const mat=new THREE.MeshStandardMaterial({color:0xd8a3ae,roughness:.55,metalness:.05});
  function hemi(side){const g=new THREE.SphereGeometry(1,160,120);const p=g.attributes.position;const v=new THREE.Vector3();
    for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i);const n=v.clone().normalize();
      const f=.055*Math.sin(9*n.x+3*n.y)*Math.sin(11*n.y+2*n.z)+.04*Math.sin(13*n.z+5*n.x)+.025*Math.sin(23*n.y+7*n.z)*Math.sin(19*n.x);
      v.multiplyScalar(1+f);v.x*=.72;v.y*=.82;v.z*=1.12;if(side*v.x<-.02)v.x*=.25;p.setXYZ(i,v.x+side*.31,v.y,v.z);}
    g.computeVertexNormals();return new THREE.Mesh(g,mat);}
  grp.add(hemi(1));grp.add(hemi(-1));
  const cb=new THREE.Mesh(new THREE.SphereGeometry(.55,64,48),new THREE.MeshStandardMaterial({color:0xc48c98,roughness:.6}));cb.scale.set(1.3,.7,.8);cb.position.set(0,-.62,-.78);grp.add(cb);
  const st=new THREE.Mesh(new THREE.CylinderGeometry(.16,.12,.9,32),new THREE.MeshStandardMaterial({color:0xb7808c,roughness:.6}));st.position.set(0,-.95,-.35);st.rotation.x=.35;grp.add(st);
  const wire=new THREE.Mesh(new THREE.SphereGeometry(1.75,48,32),new THREE.MeshBasicMaterial({color:0x4fd1ff,wireframe:true,transparent:true,opacity:.06}));grp.add(wire);
  const glowMat=new THREE.MeshBasicMaterial({color:0xf5b942,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthTest:false});
  const glow=new THREE.Mesh(new THREE.SphereGeometry(.13,32,24),glowMat);glow.position.set(.16,-.22,.55);grp.add(glow);
  const glow2=glow.clone();glow2.material=glowMat.clone();glow2.position.set(-.16,-.22,.55);grp.add(glow2);
  const halo=new THREE.Mesh(new THREE.SphereGeometry(.34,32,24),new THREE.MeshBasicMaterial({color:0xf5b942,transparent:true,opacity:.25,blending:THREE.AdditiveBlending,depthTest:false}));halo.position.set(0,-.22,.55);grp.add(halo);
  const acc=new THREE.Mesh(new THREE.SphereGeometry(.16,32,24),new THREE.MeshBasicMaterial({color:0xe1173f,transparent:true,opacity:.8,blending:THREE.AdditiveBlending,depthTest:false}));acc.position.set(0,.28,.62);grp.add(acc);
  const eyeV=new THREE.Mesh(new THREE.SphereGeometry(.2,32,24),new THREE.MeshBasicMaterial({color:0x4fd1ff,transparent:true,opacity:.8,blending:THREE.AdditiveBlending,depthTest:false}));eyeV.position.set(0,.05,-1.05);grp.add(eyeV);
  scene.add(new THREE.HemisphereLight(0xffeef2,0x1a0b14,.65));
  const key=new THREE.DirectionalLight(0xffffff,1.6);key.position.set(3,4,5);scene.add(key);
  const rim=new THREE.DirectionalLight(0xe1173f,2.2);rim.position.set(-4,1,-3);scene.add(rim);
  const fill=new THREE.DirectionalLight(0x4fd1ff,.8);fill.position.set(4,-2,-2);scene.add(fill);
  R3={renderer,scene,cam,grp,glow,glow2,halo,acc,eyeV};
}
function drawBrain(b,t){
  const c=document.getElementById('gl');
  if(!b||!b.show){c.style.opacity=0;return;}
  if(!R3) initBrain();
  c.style.opacity=b.o??1; c.style.transform=`translate(${b.x||0}px,${b.y||0}px) scale(${b.s||1})`;
  R3.grp.rotation.y=(b.rotY??0)+t*(b.spin??.25); R3.grp.rotation.x=b.rotX??.12;
  const pulse=.75+.25*Math.sin(t*5);
  const g=b.glow||0; [R3.glow,R3.glow2].forEach(m=>{m.visible=g>0;m.material.opacity=.9*g*pulse;m.scale.setScalar(1+.3*g*pulse);});
  R3.halo.visible=g>0;R3.halo.material.opacity=.3*g*pulse;R3.halo.scale.setScalar(1+.5*g);
  R3.acc.visible=(b.acc||0)>0;R3.acc.material.opacity=.8*(b.acc||0)*pulse;
  R3.eyeV.visible=(b.vis||0)>0;R3.eyeV.material.opacity=.8*(b.vis||0)*pulse;
  R3.renderer.render(R3.scene,R3.cam);
}
function brainLabel(text,x,y,u,t0,color=C.gold){const p=fade(u,t0);return p?`<svg class="abs" style="left:0;top:0;z-index:12" width="1920" height="1080"><line x1="${x}" y1="${y}" x2="${x+180*p}" y2="${y-90*p}" stroke="${color}" stroke-width="3"/><circle cx="${x}" cy="${y}" r="7" fill="${color}"/></svg>`+txt(text,x+190,y-120,{size:30,color,o:p,cls:"mono",weight:800,ls:1,w:520}):"";}

/* ---------- captions ---------- */
const KW=/^(200|milisegundos|cintura|tamaño|firmeza|mediano|hambre|cultura|hipótesis|estradiol|réplica|0\.7|cero|siete|recompensa|ciegos|matsigenka|ángulo|cuarenta|grados|juventud|omega-3|mito|falso|nacen|hacen|cerebro|26|37|66|58|266|128|catorce|diecisiete)$/i;
const CH=[];B.forEach(b=>{const w=b.txt.split(/\s+/);const g=[];let c=[];w.forEach(x=>{c.push(x);if(c.length>=7||(/[.!?…:]$/.test(x)&&c.length>=3)){g.push(c);c=[];}});if(c.length){if(g.length&&c.length<=2)g[g.length-1].push(...c);else g.push(c);}
 const tot=g.reduce((a,x)=>a+x.join(" ").length+8,0);let t=b.start;g.forEach(x=>{const d=b.dur*(x.join(" ").length+8)/tot;CH.push({t0:t,t1:t+d,w:x});t+=d;});});
function caption(t){const c=CH.find(c=>t>=c.t0&&t<c.t1+.05);if(!c)return "";const cl=w=>w.replace(/^[¡¿«"(]+/,"").replace(/[.,!?:…»")]+$/,"");return `<div class="cap" style="opacity:${fade(t,c.t0,.12)}">${c.w.map(w=>KW.test(cl(w))?`<span class="k">${w}</span>`:w).join(" ")}</div>`;}

/* ================= scenes ================= */
const S={};
const center=(html,w,y)=>el(html,(1920-w)/2,y,{w});
S.eye_hook=(u,d,b)=>{let s="";const p=lin(u,0,2.2);
  s+=el(form({whr:.72,bust:.55,seed:2}),760,150,{w:400,s:1,z:5});

function render(t){

  let pts="";for(let k=0;k<40;k++){const x=(rnd(k)*1920+t*(8+rnd(k+3)*14))%1920,y=(rnd(k+1)*1080-t*(4+rnd(k+5)*6)+2160)%1080;pts+=`<circle cx="${x}" cy="${y}" r="${1+rnd(k+2)*2.5}" fill="rgba(245,185,66,${.08+rnd(k+4)*.2})"/>`;}
